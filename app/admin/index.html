<!doctype html>
<html lang="es-BO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TICKETAZO — administración</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css?v=62">
<link rel="manifest" href="/admin/manifest.json">
<!-- La tinta de la marca: es lo que hay arriba de todo en la pantalla de
     entrar del teléfono. Adentro del panel lo cambia mostrar() (admin.js):
     blanco en la oficina, casi negro en la puerta. -->
<meta name="theme-color" content="#180E3A">
<!-- El service worker es lo que hace que esta pantalla ABRA sin internet.
     Sin el, en una feria sin senal el portero no ve ni el HTML. Se registra
     aca y no en admin.js para que empiece a guardar el shell aunque el
     usuario todavia no haya entrado. Si el navegador no lo soporta, la
     puerta funciona como siempre: online. -->
<!-- Con una sesión guardada, el formulario de entrar no se dibuja hasta que
     admin.js sepa si la sesión sigue viva: sin esto, cada recarga mostraba
     la caja de usuario y clave entrando con su animación, y medio segundo
     después la cambiaba por el panel. El reloj de 1,5 s es el seguro del
     portero sin señal: si la consulta no vuelve, la caja aparece igual y
     nadie se queda mirando una pantalla vacía. Sin sesión guardada no se
     espera nada. -->
<script>
  try {
    if (Object.keys(localStorage).some(k => /^sb-.+-auth-token$/.test(k))) {
      document.documentElement.dataset.sesion = "revisando";
      setTimeout(() => { delete document.documentElement.dataset.sesion; }, 1500);
    }
  } catch (e) { /* sin localStorage no hay sesión guardada que esperar */ }
</script>
<script>
  /* Ruta ABSOLUTA. Con "sw.js" a secas, quien entra por /admin (sin
     barra final) lo pide en /sw.js, que no existe: no se registra nada y
     nadie se entera porque el catch se lo come. */
  if ("serviceWorker" in navigator)
    addEventListener("load", () =>
      navigator.serviceWorker.register("/admin/sw.js", { scope: "/admin/" }).catch(() => {}));
</script>
</head>
<body>

<!-- La marca a la izquierda (arriba en el teléfono) y el formulario solo.
     Antes era una caja gris con la palabra TICKETAZO en la letra del texto:
     nada decía de quién era el panel, y un organizador nuevo que llega por
     un link de WhatsApp tiene que reconocer dónde está antes de escribir
     su clave. -->
<section class="entrar" id="pantallaEntrar">
  <div class="entrar-marca">
    <span class="logo" aria-hidden="true">TICKET<span>AZO</span></span>
    <p class="entrar-lema">Tus eventos, tus ventas y tu puerta, en un solo panel.</p>
  </div>
  <form class="caja" id="formEntrar">
    <h1>Entrá a tu panel</h1>
    <p class="sub">Usá el usuario y la clave que te dio tu organizador.</p>
    <label><span>Usuario</span>
      <input id="eUsuario" autocomplete="username" autocapitalize="none" enterkeyhint="next" required></label>
    <label><span>Clave</span>
      <input id="eClave" type="password" autocomplete="current-password" enterkeyhint="go" required></label>
    <button class="btn primario ancho" id="btnEntrar">Entrar</button>
    <p class="error" id="eError" role="alert"></p>
    <p class="entrar-ayuda">¿Perdiste la clave? Pedile a tu administrador que la resetee desde Equipo.</p>
  </form>
</section>

<div class="app" id="app" hidden>
  <header class="cab">
    <span class="marca">TICKET<span>AZO</span></span>
    <nav class="tabs" id="tabs"></nav>
    <span class="yo" id="yo"></span>
    <button class="btn plano chico" id="btnSalir">Salir</button>
  </header>
  <!-- La cabecera de un evento abierto: nombre, link y sus pestañas. Vive
       fuera de #main para que cada pantalla del evento pinte #main como
       siempre sin borrarla. admin.js la llena al entrar a un evento. -->
  <!-- Aparece sólo cuando un operador de TICKETAZO entró como un cliente
       (0090). Se queda fija arriba mientras dure: trabajar en la cuenta de
       otro sin darse cuenta es justo lo que esta franja evita. -->
  <div id="operando" role="status" hidden></div>
  <div class="ev-cab" id="evCab" hidden></div>
  <main id="main"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Versión exacta, igual que en el SHELL de sw.js. Con "@2" a secas cada
     teléfono corría el 2.x que hubiera el día que se instaló el service
     worker (sw.js lo guarda como inmutable), y un 2.x nuevo podía cambiar
     un default —el scope de signOut, un reintento— sin que nadie lo
     probara en la puerta. Para subirla: cambiarla en los dos lados y
     subir CACHE. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
<!-- El lector de QR de la puerta, por CDN como qrcode-generator en la landing.
     Si no carga, puerta.js lo dice y el ingreso a mano sigue funcionando. -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<!-- Para dibujar las cortesías recién emitidas sobre el arte del evento, con
     el mismo ticket.js que usan la venta y /orden/<uuid>: una cortesía que se
     ve distinta a una entrada comprada es una cortesía que en la puerta se
     discute. Si el CDN no carga, la pantalla igual muestra los códigos. -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="/config.js"></script>
<script src="/ticket.js?v=31"></script>
<!-- El CSV que se le manda al contador: separador, encoding y la
     neutralizacion de formulas viven ahi, no repartidos por las pantallas. -->
<script src="/admin/csv.js?v=30"></script>
<script src="/admin/admin.js?v=83"></script>
<script src="/admin/puerta.js?v=38"></script>
</body>
</html>
